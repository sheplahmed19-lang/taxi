<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Solutions - اصنع تطبيقك مع خبراء التطبيقات</title>
<style>
  :root {
    --purple: #7c3aed;
    --purple-light: #a78bfa;
    --cyan: #22d3ee;
    --gold: #f5b942;
    --bg-dark: #0a0a12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Tahoma", "Segoe UI", Arial, sans-serif;
    background: var(--bg-dark);
    color: #fff;
    overflow-x: hidden;
  }
  .hero {
    position: relative;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,58,237,0.35), transparent 45%),
      radial-gradient(circle at 80% 30%, rgba(34,211,238,0.25), transparent 45%),
      linear-gradient(180deg, #0a0a12 0%, #12081f 100%);
    padding: 32px 24px 60px;
  }
  .navbar {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 1200px;
    margin: 0 auto 48px;
  }
  .logo-mark {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--purple-light), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-mark::after {
    content: "";
    width: 18px;
    height: 18px;
    border-radius: 5px;
    background: #fff;
  }
  .logo-text {
    font-size: 1.4rem;
    font-weight: 700;
  }
  .content-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
  }
  .phone-col {
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 260px;
    background: #fff;
    border-radius: 32px;
    padding: 14px;
    box-shadow: 0 30px 80px rgba(124,58,237,0.45);
    color: #1e1b2e;
  }
  .phone-screen {
    background: linear-gradient(180deg, #f4f1fb, #fff);
    border-radius: 22px;
    overflow: hidden;
  }
  .phone-header {
    background: linear-gradient(135deg, var(--purple), #5b21b6);
    color: #fff;
    padding: 16px;
    border-radius: 22px 22px 0 0;
  }
  .phone-header .status { font-size: 0.7rem; opacity: 0.85; display:flex; justify-content:space-between; margin-bottom: 10px;}
  .phone-header .title-row { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .profile-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #ddd6fe; }
  .profile-row .name { font-size: 0.85rem; font-weight: 700; }
  .profile-row .sub { font-size: 0.65rem; opacity: 0.8; }
  .icon-row {
    display: flex;
    justify-content: space-around;
    padding: 16px 10px;
  }
  .icon-chip {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: #ede9fe;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }
  .icon-chip.active { background: var(--purple); color: #fff; }
  .chart-card {
    margin: 0 12px 16px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 12px;
  }
  .chart-card .label { font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; }
  .chart-svg { width: 100%; height: 70px; }
  .tab-bar {
    display: flex;
    justify-content: space-around;
    padding: 12px 0 18px;
    border-top: 1px solid #eee;
  }
  .tab-bar .dot { width: 18px; height: 18px; border-radius: 50%; background: #ddd; }
  .tab-bar .dot.fab { background: var(--purple); width: 34px; height: 34px; margin-top: -20px; }
  .text-col { text-align: right; }
  .headline {
    font-size: 3.2rem;
    font-weight: 800;
    line-height: 1.25;
    background: linear-gradient(135deg, #fff, var(--purple-light));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subheadline {
    font-size: 1.5rem;
    color: #d8d2f0;
    margin-top: 18px;
  }
  .cta-btn {
    display: inline-block;
    margin-top: 32px;
    background: linear-gradient(135deg, var(--gold), #e2a12f);
    color: #1a1200;
    font-weight: 800;
    font-size: 1.15rem;
    padding: 16px 48px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 12px 30px rgba(245,185,66,0.35);
    transition: transform 0.2s ease;
  }
  .cta-btn:hover { transform: translateY(-2px); }
  .features {
    max-width: 1200px;
    margin: 60px auto 0;
    padding-top: 40px;
    border-top: 1px solid rgba(255,255,255,0.15);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    text-align: center;
  }
  .feature {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .feature-icon {
    width: 64px;
    height: 64px;
    border: 2px solid var(--purple-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
  }
  .feature h3 { font-size: 1.05rem; font-weight: 700; }
  .feature p { font-size: 0.85rem; color: #b9b2d4; }
  @media (max-width: 860px) {
    .content-grid { grid-template-columns: 1fr; }
    .text-col { text-align: center; order: -1; }
    .headline { font-size: 2.1rem; }
    .subheadline { font-size: 1.1rem; }
    .features { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="navbar">
      <div class="logo-mark"></div>
      <div class="logo-text">Easy Solutions</div>
    </div>

    <div class="content-grid">
      <div class="text-col">
        <h1 class="headline">اصنع تطبيقك</h1>
        <p class="subheadline">مع خبراء التطبيقات</p>
        <a href="#start" class="cta-btn">ابدأ الآن</a>
      </div>

      <div class="phone-col">
        <div class="phone">
          <div class="phone-screen">
            <div class="phone-header">
              <div class="status"><span>9:41</span><span>🔔</span></div>
              <div class="title-row"><span>Dashboard</span></div>
              <div class="profile-row">
                <div class="avatar"></div>
                <div>
                  <div class="name">Hasni Shoas</div>
                  <div class="sub">easysolutions.com</div>
                </div>
              </div>
            </div>
            <div class="icon-row">
              <div class="icon-chip active">📊</div>
              <div class="icon-chip">🏠</div>
              <div class="icon-chip">📷</div>
              <div class="icon-chip">⏱️</div>
            </div>
            <div class="chart-card">
              <div class="label">Graph Chart</div>
              <svg class="chart-svg" viewBox="0 0 220 70" preserveAspectRatio="none">
                <polyline points="0,55 35,45 70,50 105,20 140,30 175,10 220,15"
                  fill="none" stroke="#7c3aed" stroke-width="3" />
              </svg>
            </div>
            <div class="tab-bar">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot fab"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">📱</div>
        <h3>تطبيقات موبايل</h3>
        <p>iOS &amp; Android</p>
      </div>
      <div class="feature">
        <div class="feature-icon">⏱️</div>
        <h3>لوحة تحكم</h3>
        <p>تقارير وتحليلات</p>
      </div>
      <div class="feature">
        <div class="feature-icon">🧠</div>
        <h3>حلول AI</h3>
        <p>ذكاء اصطناعي</p>
      </div>
      <div class="feature">
        <div class="feature-icon">☁️</div>
        <h3>استضافة سحابية</h3>
        <p>آمنة وسريعة</p>
      </div>
    </div>
  </section>
</body>
</html>
